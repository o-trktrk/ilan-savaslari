name = "ilan-savaslari"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "ilan-savaslari"
database_id = "c609d1d9-4d1d-4f83-bbc3-c8acc2b0d07b"   # D1 veritabanının adı "arabavs" olarak kalıyor (canlı, değiştirme)

[vars]
GOOGLE_CLIENT_ID = ""      # Google Cloud Console > OAuth Web Client ID (ücretsiz)
MIN_SHOWN = "3"            # liderlik tablosuna girmek için gereken minimum gösterim
# SESSION_SECRET'ı koda yazma: npx wrangler pages secret put SESSION_SECRET
